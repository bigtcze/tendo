          content: { application/problem+json: { schema: { $ref: '#/components/schemas/CompletionProblem' }, example: { type: 'about:blank', title: Bad Request, status: 400, code: invalid_idempotency_key } } }
        '401':
          description: Unauthenticated.
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' }, Set-Cookie: { $ref: '#/components/headers/ClearStaleSessionCookie' } }
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Unauthorized, status: 401, code: unauthenticated } } }
        '403':
