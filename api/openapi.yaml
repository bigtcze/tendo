openapi: 3.1.0
info:
  title: Tendo API
  version: 1.0.0
  description: Initial owner setup, local login sessions, membership-checked household reads, and operational health endpoints. Setup is an operator-authorized bootstrap, not public visitor registration. Sessions are opaque server-side records carried in an HttpOnly cookie.
servers:
  - url: /
paths:
  /api/v1/auth/setup:
    get:
      operationId: getInitialSetup
      summary: Read initial setup status
      tags: [Auth]
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Setup status.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            ETag:
              schema: { type: string, enum: ['"setup-v1-required"', '"setup-v1-complete"'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatus' }
              example: { required: true }
        '400':
          description: Trusted forwarded request metadata is malformed or inconsistent.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: 'about:blank', title: Bad Request, status: 400, code: invalid_forwarded_request }
        '403':
          description: Request Origin is foreign, malformed, or duplicated.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: 'about:blank', title: Forbidden, status: 403, code: forbidden_origin }
        '421':
          description: Request authority does not match the configured public origin.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: Setup state unavailable.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    put:
      operationId: createInitialOwner
      summary: Create the initial owner and household
      description: Requires the operator-configured bootstrap token and canonical Origin. Setup token generation is an operator action; an empty token configuration disables this operation. This does not enable public visitor registration.
      tags: [Auth]
      security:
        - SetupToken: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: Origin
          in: header
          required: true
          description: Must match the configured canonical public origin.
          schema: { type: string, format: uri }
          example: https://tendo.example
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupRequest' }
            example:
              login: owner
              password: a-long-unique-passphrase
              householdName: Veselí
              timezone: Europe/Prague
      responses:
        '201':
          description: Initial owner created.
          headers:
            Location: { schema: { type: string, const: /api/v1/auth/setup } }
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupStatus' }
              example: { required: false }
        '400': { description: 'Malformed JSON, request shape, or trusted forwarded request metadata.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Bad Request, status: 400, code: invalid_forwarded_request } } } }
        '401': { description: 'Setup token is missing or invalid.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Unauthorized, status: 401, code: unauthorized } } } }
        '403': { description: 'Request Origin is missing or does not match the configured canonical public origin.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Forbidden, status: 403 } } } }
        '409': { description: 'Setup already completed.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Conflict, status: 409, code: setup_complete } } } }
        '413': { description: 'Request body exceeds 8 KiB.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '415': { description: 'Unsupported request media type.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '421': { description: 'Request authority does not match the configured public origin.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422':
          description: Field validation failed.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ValidationProblem' }
              example: { type: 'about:blank', title: 'Validation Failed', status: 422, code: invalid_timezone, field: timezone }
        '429':
          description: Setup admission limit exceeded.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            Retry-After: { schema: { type: integer, minimum: 1 } }
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Too Many Requests, status: 429, code: rate_limited } } }
        '500': { description: 'Unexpected server failure.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '503':
          description: Setup disabled or persistence unavailable.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: 'about:blank', title: Service Unavailable, status: 503, code: unavailable }
  /api/v1/session:
    post:
      operationId: createSession
      summary: Log in with a local account
      description: Creates a server-side session and sets the session cookie. Requires the canonical Origin header. Unknown login, wrong password, and malformed credentials all return the same 401 response. Login attempts are limited per client address and by global concurrency.
      tags: [Auth]
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: Origin
          in: header
          required: true
          description: Must match the configured canonical public origin.
          schema: { type: string, format: uri }
          example: https://tendo.example
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example:
              login: owner
              password: a-long-unique-passphrase
      responses:
        '201':
          description: Session created. The cookie carries the only copy of the session secret.
          headers:
            Location: { schema: { type: string, const: /api/v1/session } }
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
              example: { userId: 0198a2f0-7c1e-7a53-9b0e-5d3f2c1a4b60, login: owner, defaultHouseholdId: 0198a2f0-7c1e-7a53-9b0e-5d3f2c1a4b61, expiresAt: '2026-11-05T10:00:00Z' }
        '400': { description: 'Malformed JSON, duplicate or unknown keys, null values, or trusted forwarded request metadata.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Bad Request, status: 400, code: invalid_request } } } }
        '401': { description: 'Login or password is incorrect.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Unauthorized, status: 401, code: invalid_credentials } } } }
        '403': { description: 'Request Origin is missing or does not match the configured canonical public origin.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Forbidden, status: 403, code: forbidden_origin } } } }
        '413': { description: 'Request body exceeds 4 KiB.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Content Too Large, status: 413, code: content_too_large } } } }
        '415': { description: 'Unsupported request media type.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Unsupported Media Type, status: 415, code: unsupported_media_type } } } }
        '421': { description: 'Request authority does not match the configured public origin.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Misdirected Request, status: 421 } } } }
        '429': { description: 'Login admission limit exceeded.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' }, Retry-After: { schema: { type: integer, minimum: 1 } } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Too Many Requests, status: 429, code: rate_limited } } } }
        '503': { description: 'Persistence unavailable.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Service Unavailable, status: 503, code: unavailable } } } }
    get:
      operationId: getSession
      summary: Read the current session
      description: Returns the session identified by the session cookie. A missing, invalid, expired, or duplicated cookie returns 401.
      tags: [Auth]
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Active session.
          headers:
            ETag: { schema: { type: string, pattern: '^"session-[0-9a-f-]{36}"$' } }
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
              example: { userId: 0198a2f0-7c1e-7a53-9b0e-5d3f2c1a4b60, login: owner, defaultHouseholdId: 0198a2f0-7c1e-7a53-9b0e-5d3f2c1a4b61, expiresAt: '2026-11-05T10:00:00Z' }
        '400': { description: 'Trusted forwarded request metadata is malformed or inconsistent.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Bad Request, status: 400, code: invalid_forwarded_request } } } }
        '401': { description: 'No valid session cookie. When a single session cookie names an unknown, expired, or revoked session, the response also clears that cookie.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' }, Set-Cookie: { $ref: '#/components/headers/ClearStaleSessionCookie' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Unauthorized, status: 401, code: unauthenticated } } } }
        '403': { description: 'Request Origin is foreign, malformed, or duplicated.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Forbidden, status: 403, code: forbidden_origin } } } }
        '421': { description: 'Request authority does not match the configured public origin.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Misdirected Request, status: 421 } } } }
        '503': { description: 'Persistence unavailable.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Service Unavailable, status: 503, code: unavailable } } } }
    delete:
      operationId: deleteSession
      summary: Log out
      description: Deletes the server-side session when a session cookie is present. On 204 the session cookie is cleared, including when no cookie was sent. On 503 the cookie is kept so the client can retry. Requires the canonical Origin header.
      tags: [Auth]
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: Origin
          in: header
          required: true
          description: Must match the configured canonical public origin.
          schema: { type: string, format: uri }
          example: https://tendo.example
      responses:
        '204':
          description: Session deleted and cookie cleared.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SetSessionCookie' }
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
        '400': { description: 'Trusted forwarded request metadata is malformed or inconsistent.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Bad Request, status: 400, code: invalid_forwarded_request } } } }
        '403': { description: 'Request Origin is missing or does not match the configured canonical public origin.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Forbidden, status: 403, code: forbidden_origin } } } }
        '421': { description: 'Request authority does not match the configured public origin.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Misdirected Request, status: 421 } } } }
        '503': { description: 'Persistence unavailable; the session may not have been deleted.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Service Unavailable, status: 503, code: unavailable } } } }
  /api/v1/households/{householdId}:
    get:
      operationId: getHousehold
      summary: Read a household
      description: Returns the household only when the authenticated user has a membership in it, with any role. The path identifier is authorization context and is validated against membership on every request. A malformed identifier, a nonexistent household, and a household the caller does not belong to all return the same 404 response. The defaultHouseholdId from the session is a navigation hint and grants no access. The ETag is the strong, quoted decimal resource version.
      tags: [Households]
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200':
          description: Household visible to the caller.
          headers:
            ETag: { description: Strong entity tag derived from the household resource version., schema: { type: string, pattern: '^"[1-9][0-9]*"$' }, example: '"1"' }
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Household' }
              example: { id: 0198a2f0-7c1e-7a53-9b0e-5d3f2c1a4b61, name: Veselí, timezone: Europe/Prague, createdAt: '2026-10-06T10:00:00Z' }
        '400': { description: 'Trusted forwarded request metadata is malformed or inconsistent.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Bad Request, status: 400, code: invalid_forwarded_request } } } }
        '401': { description: 'No valid session cookie. When a single session cookie names an unknown, expired, or revoked session, the response also clears that cookie.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' }, Set-Cookie: { $ref: '#/components/headers/ClearStaleSessionCookie' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Unauthorized, status: 401, code: unauthenticated } } } }
        '403': { description: 'Request Origin is foreign, malformed, or duplicated.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Forbidden, status: 403, code: forbidden_origin } } } }
        '404': { description: 'The identifier is malformed, the household does not exist, or the caller is not a member. All three cases are indistinguishable.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Not Found, status: 404, code: not_found } } } }
        '421': { description: 'Request authority does not match the configured public origin.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Misdirected Request, status: 421 } } } }
        '503': { description: 'Persistence unavailable.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Service Unavailable, status: 503, code: unavailable } } } }
  /health/live:
    get:
      operationId: getLiveness
      summary: Check that the HTTP process responds
      description: Does not check dependencies. Intended for process liveness probes.
      tags: [Health]
      security: []
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      responses:
        '200':
          description: The HTTP process is responding.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusResponse' }
              example: { status: ok }
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check whether PostgreSQL is reachable and the process is not draining
      description: Returns unavailable when the database ping fails or graceful shutdown has begun.
      tags: [Health]
      security: []
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      responses:
        '200':
          description: PostgreSQL is reachable and shutdown has not begun.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusResponse' }
              example: { status: ok }
        '503':
          description: PostgreSQL is unavailable or graceful shutdown has begun.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: 'about:blank', title: 'Service Unavailable', status: 503 }
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: tendo_session
      description: Opaque session cookie, 43 base64url characters. The cookie is named __Host-tendo_session and marked Secure when TENDO_PUBLIC_URL is HTTPS, and tendo_session without Secure when it is plain HTTP. Always HttpOnly, SameSite=Lax, Path=/, no Domain, 30-day absolute lifetime.
    SetupToken:
      type: apiKey
      in: header
      name: X-Tendo-Setup-Token
      description: Standard base64 encoding of 32 random bytes (44 characters ending in =). Operator generates with openssl rand -base64 32.
  headers:
    ClearStaleSessionCookie:
      description: Sent only when the request carried one session cookie naming an unknown, expired, or revoked session. Clears that cookie with an empty value and Max-Age=0, using the same name and attributes as SetSessionCookie.
      required: false
      schema: { type: string }
      example: __Host-tendo_session=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax
    SetSessionCookie:
      required: true
      description: Session cookie. HttpOnly; Path=/; SameSite=Lax; no Domain. Login sets Max-Age=2592000, logout sets Max-Age=0. HTTPS public URL uses the name __Host-tendo_session with Secure; HTTP public URL uses tendo_session.
      schema: { type: string }
      example: __Host-tendo_session=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA; Path=/; Max-Age=2592000; HttpOnly; Secure; SameSite=Lax
    RequestId:
      description: Correlation ID echoed from a valid request header or generated by Tendo.
      schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$' }
      example: smoke-test_01
    NoStore:
      description: Prevents responses from being cached.
      schema: { type: string, const: no-store }
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Optional caller-supplied correlation ID.
      schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$' }
      example: smoke-test_01
    HouseholdId:
      name: householdId
      in: path
      required: true
      description: Household identifier. Authorization context; access is checked against membership.
      schema: { type: string, format: uuid, x-go-type: string }
      example: 0198a2f0-7c1e-7a53-9b0e-5d3f2c1a4b61
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string }
      additionalProperties: true
    SetupStatus:
      type: object
      additionalProperties: false
      required: [required]
      properties:
        required: { type: boolean }
    SetupRequest:
      type: object
      additionalProperties: false
      required: [login, password, householdName, timezone]
      properties:
        login: { type: string, minLength: 3, maxLength: 64, pattern: '^[a-z0-9][a-z0-9._-]{2,63}$' }
        password: { type: string, minLength: 15, maxLength: 128, description: 15–128 Unicode scalar values; maximum 512 UTF-8 bytes }
        householdName: { type: string, minLength: 1, maxLength: 100, description: Trimmed value must be nonempty and contain no control characters. }
        timezone: { type: string, minLength: 1, maxLength: 128, description: Valid named IANA timezone; UTC accepted; Local and fixed offsets are not accepted. }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login: { type: string, maxLength: 64 }
        password: { type: string, maxLength: 512 }
    Session:
      type: object
      additionalProperties: false
      required: [userId, login, expiresAt]
      properties:
        userId: { type: string, format: uuid, x-go-type: string }
        login: { type: string }
        defaultHouseholdId: { type: string, format: uuid, x-go-type: string, description: Omitted when the account has no default household. }
        expiresAt: { type: string, format: date-time }
    Household:
      type: object
      additionalProperties: false
      required: [id, name, timezone, createdAt]
      properties:
        id: { type: string, format: uuid, x-go-type: string }
        name: { type: string, minLength: 1, maxLength: 100 }
        timezone: { type: string, description: Named IANA timezone. }
        createdAt: { type: string, format: date-time }
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [field, code]
          properties:
            field: { type: string, enum: [login, password, householdName, timezone] }
            code: { type: string }
    StatusResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable], x-go-type: string }
