          content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Not Found, status: 404, code: not_found } } }
        '409':
          description: Codes are item_archived when the item is archived and item_done when it is already done.
