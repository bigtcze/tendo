openapi: 3.1.0
info:
  title: Tendo Runtime Health API
  version: 1.0.0
  description: Development-only operational health endpoints. Readiness checks PostgreSQL and returns unavailable during graceful shutdown; liveness reports only that the HTTP process responds.
servers:
  - url: /
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check that the HTTP process responds
      description: Does not check dependencies. Intended for process liveness probes.
      tags: [Health]
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '400':
          description: Request parsing failure.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '200':
          description: The HTTP process is responding.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusResponse' }
              example: { status: ok }
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check whether PostgreSQL is reachable and the process is not draining
      description: Returns unavailable when the database ping fails or graceful shutdown has begun. The database ping is bounded by the configured database timeout.
      tags: [Health]
      security: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '400':
          description: Request parsing failure.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '200':
          description: PostgreSQL is reachable and shutdown has not begun.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusResponse' }
              example: { status: ok }
        '503':
          description: PostgreSQL is unavailable or graceful shutdown has begun.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: 'about:blank', title: 'Service Unavailable', status: 503 }
components:
  headers:
    RequestId:
      description: Bounded correlation ID echoed from a valid request header or generated by Tendo.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,64}$'
      example: smoke-test_01
    NoStore:
      description: Prevents health responses from being cached.
      schema:
        type: string
        const: no-store
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Optional caller-supplied correlation ID; only 1–64 ASCII letters, digits, dots, underscores, or hyphens are accepted. Invalid values are replaced with a generated ID.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,64}$'
      example: smoke-test_01
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
      additionalProperties: true
    StatusResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
          x-go-type: string
