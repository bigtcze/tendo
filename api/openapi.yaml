  /api/v1/households/{householdId}/items/{itemId}/completions/{completionId}:
    patch:
      operationId: undoItemCompletion
      summary: Undo the latest active completion
      description: 'Evaluation order is authentication, canonical Origin/authority, exactly one syntactically valid strong If-Match, media/body validation including undone=true, membership and item/receipt existence, item row lock, receipt lookup, and then the stored-version check, archived state, latest-active receipt and commit. Missing If-Match returns 428; malformed, weak, wildcard, or list returns 412. Body missing undone, null, wrong type, unknown fields, or malformed JSON returns 400 invalid_request; undone=false returns 422 with field undone and code invalid_value. An already-undone receipt replays unchanged after request validation and locking, skipping only the stored-version comparison. Undo restores cycleAttentionOn and priorWorkflowState from the receipt snapshot, clears done, and increments item version. Thus an attentionOn edit after completion is intentionally overwritten by undo. Recurrence policy, title, notes, and subject are user choices and remain unchanged. A previously undone receipt is no longer latest active; chaining undos therefore restores earlier cycles. Completion receipts are never deleted. Requires canonical Origin.'
      tags: [Completions]
      security: [{ SessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/HouseholdId'
        - $ref: '#/components/parameters/ItemId'
        - name: completionId
          in: path
          required: true
          schema: { type: string, format: uuid, x-go-type: string }
        - name: If-Match
          in: header
          required: true
          description: 'Exactly one syntactically valid strong item ETag is required on every request. Missing returns 428; malformed, weak, wildcard, or list returns 412. For an already-undone replay only the stored-version comparison is skipped.'
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
          example: '"3"'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UndoCompletionRequest' }
            example: { undone: true }
      responses:
        '200':
          description: Receipt marked undone. No ETag; GET the item for its current ETag.
          headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Completion' }, example: { id: 0198a2f0-7c1e-7a53-9b0e-5d3f2c1a4b90, itemId: 0198a2f0-7c1e-7a53-9b0e-5d3f2c1a4b80, completedOn: '2026-10-07', completedByUserId: 0198a2f0-7c1e-7a53-9b0e-5d3f2c1a4b60, cycleAttentionOn: '2026-10-01', recurrence: null, nextAttentionOn: null, createdAt: '2026-10-07T10:00:00Z', undoneAt: '2026-10-07T11:00:00Z', undoneByUserId: 0198a2f0-7c1e-7a53-9b0e-5d3f2c1a4b60 } } }
        '400': { description: 'Malformed JSON or unknown fields.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Bad Request, status: 400, code: invalid_request } } } }
        '401': { description: 'No valid session cookie. When a single session cookie names an unknown, expired, or revoked session, the response also clears that cookie.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' }, Set-Cookie: { $ref: '#/components/headers/ClearStaleSessionCookie' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Unauthorized, status: 401, code: unauthenticated } } } }
        '403': { description: Missing or invalid Origin., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Forbidden, status: 403, code: forbidden_origin } } } }
        '404': { description: 'Membership, item, or completion not found (uniform; malformed IDs included).', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Not Found, status: 404, code: not_found } } } }
        '409': { description: item_archived or completion_not_latest., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/CompletionProblem' }, example: { type: 'about:blank', title: Conflict, status: 409, code: completion_not_latest } } } }
        '412': { description: 'Malformed, weak, or stale If-Match.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Precondition Failed, status: 412, code: precondition_failed } } } }
        '413': { description: Body exceeds 4 KiB., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: 'Content Too Large', status: 413, code: content_too_large } } } }
        '415': { description: Unsupported media type., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: 'Unsupported Media Type', status: 415, code: unsupported_media_type } } } }
        '421': { description: Invalid authority., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Misdirected Request, status: 421 } } } }
        '422': { description: 'undone=false returns 422 with field undone; missing, null, wrong type, unknown fields, and malformed JSON return 400 invalid_request.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/CompletionProblem' }, example: { type: 'about:blank', title: Validation Failed, status: 422, code: invalid_value, field: undone } } } }
        '428': { description: Missing If-Match., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Precondition Required, status: 428, code: precondition_required } } } }
        '503': { description: Persistence unavailable., headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Service Unavailable, status: 503, code: unavailable } } } }
  /api/v1/households/{householdId}/items/{itemId}:
    get:
      operationId: getItem
      summary: Read an item
      description: 'Returns the item, archived or not, when the caller is a household member. The strong ETag identifies the stored item version used for If-Match; the attention field is derived per request using the household timezone and can change at household-local midnight without a version change. Responses are Cache-Control: no-store.'
      tags: [Items]
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/HouseholdId'
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Item visible to the caller.
          headers:
            ETag: { description: Strong entity tag identifying the stored item version used for If-Match., schema: { type: string, pattern: '^"[1-9][0-9]*"$' }, example: '"1"' }
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
