            ETag: { description: Strong entity tag identifying the stored item version used for If-Match., schema: { type: string, pattern: '^"[1-9][0-9]*"$' }, example: '"1"' }
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
              example: { id: 0198a2f0-7c1e-7a53-9b0e-5d3f2c1a4b80, subjectId: 0198a2f0-7c1e-7a53-9b0e-5d3f2c1a4b70, title: Renew car insurance, notes: Compare two quotes first., attentionOn: '2026-11-01', workflowState: open, attention: upcoming, archived: false, createdAt: '2026-10-07T10:00:00Z', updatedAt: '2026-10-07T10:00:00Z' }
        '400': { description: 'Trusted forwarded request metadata is malformed or inconsistent.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Bad Request, status: 400, code: invalid_forwarded_request } } } }
        '401': { description: 'No valid session cookie. When a single session cookie names an unknown, expired, or revoked session, the response also clears that cookie.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' }, Set-Cookie: { $ref: '#/components/headers/ClearStaleSessionCookie' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Unauthorized, status: 401, code: unauthenticated } } } }
        '403': { description: 'Request Origin is missing, foreign, malformed, or duplicated.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Forbidden, status: 403, code: forbidden_origin } } } }
        '404': { description: 'The household or item identifier is malformed, the item does not exist in that household, or the caller is not a member. All cases are indistinguishable.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Not Found, status: 404, code: not_found } } } }
        '421': { description: 'Request authority does not match the configured public origin.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Misdirected Request, status: 421 } } } }
        '503': { description: 'Persistence unavailable.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Service Unavailable, status: 503, code: unavailable } } } }
    patch:
      operationId: updateItem
      summary: Update, move, change state of, archive, or unarchive an item
      description: 'Partial update of title, subjectId, notes, attentionOn, workflowState, and archived. At least one field is required. notes and attentionOn accept null to clear the value; clearing attentionOn makes the item need attention immediately. null is rejected for every other field. subjectId is validated (same household, not archived) only when it is sent. If-Match with the current strong ETag identifying the stored item version is required; every successful update increments the version. The attention field is derived per request using the household timezone and may change at household-local midnight without a version change. Responses are Cache-Control: no-store. Archived items remain readable and editable. Requires the canonical Origin header.'
      tags: [Items]
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/HouseholdId'
        - $ref: '#/components/parameters/ItemId'
        - name: If-Match
          in: header
          required: true
          description: Single strong entity tag of the version being replaced. The wildcard *, weak tags, and lists are rejected with 412.
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
          example: '"1"'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateItemRequest' }
            example: { workflowState: in_progress }
      responses:
        '200':
          description: Item updated; the ETag carries the new version.
          headers:
            ETag: { description: Strong entity tag derived from the item version., schema: { type: string, pattern: '^"[1-9][0-9]*"$' }, example: '"2"' }
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
              example: { id: 0198a2f0-7c1e-7a53-9b0e-5d3f2c1a4b80, subjectId: 0198a2f0-7c1e-7a53-9b0e-5d3f2c1a4b70, title: Renew car insurance, notes: Compare two quotes first., attentionOn: '2026-11-01', workflowState: in_progress, attention: upcoming, archived: false, createdAt: '2026-10-07T10:00:00Z', updatedAt: '2026-10-07T11:00:00Z' }
        '400': { description: 'Malformed JSON, unknown or duplicate keys, null for a field that does not accept null, empty patch, or wrong value types. Also trusted forwarded request metadata that is malformed.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Bad Request, status: 400, code: invalid_request } } } }
        '401': { description: 'No valid session cookie. When a single session cookie names an unknown, expired, or revoked session, the response also clears that cookie.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' }, Set-Cookie: { $ref: '#/components/headers/ClearStaleSessionCookie' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Unauthorized, status: 401, code: unauthenticated } } } }
        '403': { description: 'Request Origin is missing, foreign, malformed, or duplicated.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Forbidden, status: 403, code: forbidden_origin } } } }
        '404': { description: 'The household or item identifier is malformed, the item does not exist in that household, or the caller is not a member. All cases are indistinguishable.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Not Found, status: 404, code: not_found } } } }
        '412': { description: 'If-Match is malformed, weak, a list of tags, the wildcard *, or does not match the current item version. If-Match: * and weak or list entity tags are not supported and are rejected with 412.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Precondition Failed, status: 412, code: precondition_failed } } } }
        '413': { description: 'Request body exceeds 64 KiB.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Request Entity Too Large, status: 413, code: content_too_large } } } }
        '415': { description: 'Unsupported request media type.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Unsupported Media Type, status: 415, code: unsupported_media_type } } } }
        '421': { description: 'Request authority does not match the configured public origin.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Misdirected Request, status: 421 } } } }
        '422': { description: 'Field validation failed. field is title, subjectId, notes, attentionOn, or workflowState. Codes: invalid_length, invalid_characters, invalid_date, invalid_workflow_state, invalid_reference (subjectId is malformed, not a subject of this household, or archived).', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/ItemValidationProblem' }, example: { type: 'about:blank', title: Validation Failed, status: 422, code: invalid_length, field: title } } } }
        '428': { description: 'The If-Match header is missing. A present but unsupported value (wildcard *, weak or list entity tags) returns 412, not 428.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Precondition Required, status: 428, code: precondition_required } } } }
        '503': { description: 'Persistence unavailable.', headers: { X-Request-ID: { $ref: '#/components/headers/RequestId' }, Cache-Control: { $ref: '#/components/headers/NoStore' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' }, example: { type: 'about:blank', title: Service Unavailable, status: 503, code: unavailable } } } }
  /health/live:
    get:
      operationId: getLiveness
      summary: Check that the HTTP process responds
      description: Does not check dependencies. Intended for process liveness probes.
      tags: [Health]
      security: []
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      responses:
        '200':
          description: The HTTP process is responding.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusResponse' }
              example: { status: ok }
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check whether PostgreSQL is reachable and the process is not draining
      description: Returns unavailable when the database ping fails or graceful shutdown has begun.
      tags: [Health]
      security: []
      parameters: [{ $ref: '#/components/parameters/RequestId' }]
      responses:
        '200':
          description: PostgreSQL is reachable and shutdown has not begun.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusResponse' }
              example: { status: ok }
        '503':
          description: PostgreSQL is unavailable or graceful shutdown has begun.
          headers:
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example: { type: 'about:blank', title: 'Service Unavailable', status: 503 }
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: tendo_session
      description: Opaque session cookie, 43 base64url characters. The cookie is named __Host-tendo_session and marked Secure when TENDO_PUBLIC_URL is HTTPS, and tendo_session without Secure when it is plain HTTP. Always HttpOnly, SameSite=Lax, Path=/, no Domain, 30-day absolute lifetime.
    SetupToken:
      type: apiKey
      in: header
      name: X-Tendo-Setup-Token
      description: Standard base64 encoding of 32 random bytes (44 characters ending in =). Operator generates with openssl rand -base64 32.
  headers:
    ClearStaleSessionCookie:
      description: Sent only when the request carried one session cookie naming an unknown, expired, or revoked session. Clears that cookie with an empty value and Max-Age=0, using the same name and attributes as SetSessionCookie.
      required: false
      schema: { type: string }
      example: __Host-tendo_session=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax
    SetSessionCookie:
      required: true
      description: Session cookie. HttpOnly; Path=/; SameSite=Lax; no Domain. Login sets Max-Age=2592000, logout sets Max-Age=0. HTTPS public URL uses the name __Host-tendo_session with Secure; HTTP public URL uses tendo_session.
      schema: { type: string }
      example: __Host-tendo_session=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA; Path=/; Max-Age=2592000; HttpOnly; Secure; SameSite=Lax
    RequestId:
      description: Correlation ID echoed from a valid request header or generated by Tendo.
      schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$' }
      example: smoke-test_01
    NoStore:
      description: Prevents responses from being cached.
      schema: { type: string, const: no-store }
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Optional caller-supplied correlation ID.
      schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$' }
      example: smoke-test_01
    HouseholdId:
      name: householdId
      in: path
      required: true
      description: Household identifier. Authorization context; access is checked against membership.
      schema: { type: string, format: uuid, x-go-type: string }
      example: 0198a2f0-7c1e-7a53-9b0e-5d3f2c1a4b61
    SubjectId:
      name: subjectId
      in: path
      required: true
      description: Subject identifier.
      schema: { type: string, format: uuid, x-go-type: string }
      example: 0198a2f0-7c1e-7a53-9b0e-5d3f2c1a4b70
    ItemId:
      name: itemId
      in: path
      required: true
      description: Item identifier.
      schema: { type: string, format: uuid, x-go-type: string }
      example: 0198a2f0-7c1e-7a53-9b0e-5d3f2c1a4b80
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items per page.
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor copied from a previous nextCursor. Do not construct or parse it.
      schema: { type: string, minLength: 1, maxLength: 128 }
    Archived:
      name: archived
      in: query
      required: false
      description: false (default) lists active resources; true lists archived resources only.
      schema: { type: boolean, default: false }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string }
      additionalProperties: true
    SetupStatus:
      type: object
      additionalProperties: false
      required: [required]
      properties:
        required: { type: boolean }
    SetupRequest:
      type: object
      additionalProperties: false
      required: [login, password, householdName, timezone]
      properties:
        login: { type: string, minLength: 3, maxLength: 64, pattern: '^[a-z0-9][a-z0-9._-]{2,63}$' }
        password: { type: string, minLength: 15, maxLength: 128, description: 15–128 Unicode scalar values; maximum 512 UTF-8 bytes }
        householdName: { type: string, minLength: 1, maxLength: 100, description: Trimmed value must be nonempty and contain no control characters. }
        timezone: { type: string, minLength: 1, maxLength: 128, description: Valid named IANA timezone; UTC accepted; Local and fixed offsets are not accepted. }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, password]
      properties:
        login: { type: string, maxLength: 64 }
        password: { type: string, maxLength: 512 }
    Session:
      type: object
      additionalProperties: false
      required: [userId, login, expiresAt]
      properties:
        userId: { type: string, format: uuid, x-go-type: string }
        login: { type: string }
        defaultHouseholdId: { type: string, format: uuid, x-go-type: string, description: Omitted when the account has no default household. }
        expiresAt: { type: string, format: date-time }
    Household:
      type: object
      additionalProperties: false
      required: [id, name, timezone, createdAt]
      properties:
        id: { type: string, format: uuid, x-go-type: string }
        name: { type: string, minLength: 1, maxLength: 100 }
        timezone: { type: string, description: Named IANA timezone. }
        createdAt: { type: string, format: date-time }
    SubjectType:
      type: string
      enum: [person, home, vehicle, pet, custom]
    Subject:
      type: object
      additionalProperties: false
      required: [id, type, name, archived, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid, x-go-type: string }
        type: { $ref: '#/components/schemas/SubjectType' }
        name: { type: string, minLength: 1, maxLength: 100 }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SubjectList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Subject' }
        nextCursor: { type: [string, 'null'], x-go-type: '*string', description: Opaque cursor for the next page; null on the last page. }
    CreateSubjectRequest:
      type: object
      additionalProperties: false
      required: [name, type]
      properties:
        name: { type: string, description: '1 to 100 characters after trimming leading and trailing whitespace. Control, format (zero-width and bidirectional), and line or paragraph separator characters are rejected. Other values are rejected with 422.' }
        type: { $ref: '#/components/schemas/SubjectType' }
    UpdateSubjectRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, description: '1 to 100 characters after trimming leading and trailing whitespace. Control, format (zero-width and bidirectional), and line or paragraph separator characters are rejected. Other values are rejected with 422.' }
        type: { $ref: '#/components/schemas/SubjectType' }
        archived: { type: boolean }
    QueryProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            parameter: { type: string, enum: [limit, cursor, archived] }
    SubjectValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [field, code]
          properties:
            field: { type: string, enum: [name, type] }
            code: { type: string, enum: [invalid_characters, invalid_length, invalid_type] }
    WorkflowState:
      type: string
      enum: [open, in_progress, waiting, paused]
    ItemAttention:
      type: string
      description: Derived server-side from attentionOn and today's date in the household timezone; never set by clients. needs_attention when attentionOn is null or not after today, otherwise upcoming.
      enum: [upcoming, needs_attention]
    Item:
      type: object
      additionalProperties: false
      required: [id, subjectId, title, notes, attentionOn, workflowState, attention, archived, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid, x-go-type: string }
        subjectId: { type: string, format: uuid, x-go-type: string }
        title: { type: string, minLength: 1, maxLength: 200 }
        notes: { type: [string, 'null'], x-go-type: '*string', maxLength: 4000 }
        attentionOn: { type: [string, 'null'], format: date, x-go-type: '*string', description: Current attention date; null means needs attention immediately. }
        workflowState: { $ref: '#/components/schemas/WorkflowState' }
        attention: { $ref: '#/components/schemas/ItemAttention' }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ItemList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/Item' }
        nextCursor: { type: [string, 'null'], x-go-type: '*string', description: Opaque cursor for the next page; null on the last page. }
    CreateItemRequest:
      type: object
      additionalProperties: false
      required: [title, subjectId]
      properties:
        title: { type: string, description: '1 to 200 characters after trimming leading and trailing whitespace. Control, format (zero-width and bidirectional), and line or paragraph separator characters are rejected with 422.' }
        subjectId: { type: string, description: Identifier of an active subject in the same household; otherwise 422 invalid_reference. }
        notes: { type: [string, 'null'], x-go-type: '*string', description: 'Free text stored exactly as given, 1 to 4000 characters. Newline, carriage return, and tab are allowed; other control, format (zero-width and bidirectional), and line or paragraph separator characters are rejected with 422. The empty string is rejected; send null to clear.' }
        attentionOn: { type: [string, 'null'], x-go-type: '*string', description: 'Business date in the household timezone, written YYYY-MM-DD and a real calendar date. Null or omitted means the item needs attention immediately. Past dates are allowed. Invalid values are rejected with 422.' }
    UpdateItemRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, description: '1 to 200 characters after trimming leading and trailing whitespace. Control, format (zero-width and bidirectional), and line or paragraph separator characters are rejected with 422.' }
        subjectId: { type: string, description: Identifier of an active subject in the same household; otherwise 422 invalid_reference. }
        notes: { type: [string, 'null'], x-go-type: '*string', description: 'Free text stored exactly as given, 1 to 4000 characters. Newline, carriage return, and tab are allowed; other control, format (zero-width and bidirectional), and line or paragraph separator characters are rejected with 422. The empty string is rejected; send null to clear. Null clears the notes.' }
        attentionOn: { type: [string, 'null'], x-go-type: '*string', description: 'Business date in the household timezone, written YYYY-MM-DD and a real calendar date. Omitted leaves the current date unchanged; null clears it and makes the item need attention immediately. Past dates are allowed. Invalid values are rejected with 422.' }
        workflowState: { $ref: '#/components/schemas/WorkflowState' }
        archived: { type: boolean }
    ItemValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [field, code]
          properties:
            field: { type: string, enum: [title, subjectId, notes, attentionOn, workflowState] }
            code: { type: string, enum: [invalid_characters, invalid_length, invalid_date, invalid_workflow_state, invalid_reference] }
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [field, code]
          properties:
            field: { type: string, enum: [login, password, householdName, timezone] }
            code: { type: string }
    StatusResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable], x-go-type: string }
