        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCompletionRequest' }
            examples:
              today: { value: {} }
              historical: { value: { completedOn: '2026-10-06' } }
      responses:
        '201':
          description: Completion receipt created or idempotently replayed. No ETag is returned; GET the item for its current ETag.
          headers:
            Location: { description: Canonical URL for the created or replayed completion receipt., schema: { type: string, pattern: '^/api/v1/households/[0-9a-fA-F-]{36}/items/[0-9a-fA-F-]{36}/completions/[0-9a-fA-F-]{36}$' }, example: /api/v1/households/0198a2f0-7c1e-7a53-9b0e-5d3f2c1a4b61/items/0198a2f0-7c1e-7a53-9b0e-5d3f2c1a4b80/completions/0198a2f0-7c1e-7a53-9b0e-5d3f2c1a4b90 }
            X-Request-ID: { $ref: '#/components/headers/RequestId' }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Completion' }
              example: { id: 0198a2f0-7c1e-7a53-9b0e-5d3f2c1a4b90, itemId: 0198a2f0-7c1e-7a53-9b0e-5d3f2c1a4b80, completedOn: '2026-10-07', completedByUserId: 0198a2f0-7c1e-7a53-9b0e-5d3f2c1a4b60, cycleAttentionOn: '2026-10-01', recurrence: null, nextAttentionOn: null, createdAt: '2026-10-07T10:00:00Z', undoneAt: null, undoneByUserId: null }
        '400':
