<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir>/tmp/tendo-visual-font-cache</cachedir>
  <alias><family>system-ui</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>ui-sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>ui-rounded</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>SF Pro Rounded</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Segoe UI Variable</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Segoe UI</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>-apple-system</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Helvetica Neue</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>ui-serif</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>New York</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>Charter</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>Iowan Old Style</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>Georgia</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Liberation Mono</family></prefer></alias>
</fontconfig>
