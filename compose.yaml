services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: tendo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set hexadecimal POSTGRES_PASSWORD in .env}
      TENDO_DATABASE_PASSWORD: ${TENDO_DATABASE_PASSWORD:?Set hexadecimal TENDO_DATABASE_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    configs:
      # Runs once, when the data volume is first created.
      - source: postgres-init
        target: /docker-entrypoint-initdb.d/010-role.sh
        mode: 0555
    healthcheck:
      # TCP probe: the image's init-time temporary server listens only on the Unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d tendo"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  migrate:
    image: ghcr.io/bigtcze/tendo:${TENDO_VERSION:-latest}
    entrypoint: ["/tendo", "migrate"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?Set hexadecimal POSTGRES_PASSWORD in .env}@postgres:5432/tendo?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: ghcr.io/bigtcze/tendo:${TENDO_VERSION:-latest}
    stop_grace_period: 70s
    environment:
      DATABASE_URL: postgres://tendo:${TENDO_DATABASE_PASSWORD:?Set hexadecimal TENDO_DATABASE_PASSWORD in .env}@postgres:5432/tendo?sslmode=disable
      TENDO_LISTEN_ADDR: 0.0.0.0:8080
      TENDO_PUBLIC_URL: ${TENDO_PUBLIC_URL:?Set TENDO_PUBLIC_URL to the canonical origin}
      TENDO_TRUSTED_PROXY_CIDRS: ${TENDO_TRUSTED_PROXY_CIDRS:-}
      TENDO_DB_TIMEOUT: ${TENDO_DB_TIMEOUT:-2}s
      TENDO_SHUTDOWN_TIMEOUT: ${TENDO_SHUTDOWN_TIMEOUT:-10}s
      TENDO_SETUP_TOKEN: ${TENDO_SETUP_TOKEN:-}
      TENDO_OIDC_ISSUER: ${TENDO_OIDC_ISSUER:-}
      TENDO_OIDC_CLIENT_ID: ${TENDO_OIDC_CLIENT_ID:-}
      TENDO_OIDC_CLIENT_SECRET: ${TENDO_OIDC_CLIENT_SECRET:-}
      TENDO_OIDC_CLIENT_SECRET_FILE: ${TENDO_OIDC_CLIENT_SECRET_FILE:-}
      TENDO_OIDC_DISPLAY_NAME: ${TENDO_OIDC_DISPLAY_NAME:-}
    ports:
      - "127.0.0.1:${TENDO_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: "${TENDO_RESTART_POLICY:-unless-stopped}"

configs:
  # Creates the restricted role the app connects as. `$$` keeps Compose from interpolating.
  postgres-init:
    content: |
      #!/bin/sh
      set -eu
      psql --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" \
        --set=application_password="$$TENDO_DATABASE_PASSWORD" <<'SQL'
      CREATE ROLE tendo LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD :'application_password';
      GRANT CONNECT ON DATABASE tendo TO tendo;
      REVOKE CREATE ON SCHEMA public FROM PUBLIC;
      GRANT USAGE ON SCHEMA public TO tendo;
      SQL

volumes:
  postgres-data:
