services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: tendo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set hexadecimal POSTGRES_PASSWORD in .env}
      TENDO_DATABASE_PASSWORD: ${TENDO_DATABASE_PASSWORD:?Set hexadecimal TENDO_DATABASE_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tendo"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  app:
    build: .
    stop_grace_period: 70s
    environment:
      DATABASE_URL: postgres://tendo:${TENDO_DATABASE_PASSWORD:?Set hexadecimal TENDO_DATABASE_PASSWORD in .env}@postgres:5432/tendo?sslmode=disable
      TENDO_LISTEN_ADDR: 0.0.0.0:8080
      TENDO_DB_TIMEOUT: ${TENDO_DB_TIMEOUT:-2}s
      TENDO_SHUTDOWN_TIMEOUT: ${TENDO_SHUTDOWN_TIMEOUT:-10}s
    ports:
      - "127.0.0.1:${TENDO_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: "${TENDO_RESTART_POLICY:-unless-stopped}"

volumes:
  postgres-data:
