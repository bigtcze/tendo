name: Required

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: required-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: backend
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Validate autonomous bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f .autonomous/GUARDRAILS.md
          test -f .autonomous/CHARTER.md
          test -f .autonomous/PRODUCT.md
          test -f .autonomous/ROADMAP.md
          test -f .autonomous/UX.md
          test -f .autonomous/ARCHITECTURE.md
          test -f .autonomous/API.md
          test -f .autonomous/TESTING.md
          test -f .autonomous/DOCUMENTATION.md
          test -f .autonomous/DEFINITION_OF_DONE.md
          test -f .autonomous/FLOW.md
          test -f .autonomous/STATE.md
          test -f .autonomous/LEARNINGS.md
          test -f .autonomous/CYCLE_PROMPT.md
          bash -n scripts/autonomous-loop.sh
      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l $(find backend -name '*.go' -type f))"
          if [[ -n "$files" ]]; then
            printf 'Go files need formatting:\n%s\n' "$files"
            exit 1
          fi
      - name: Go vet
        working-directory: backend
        run: go vet ./...
      - name: Go unit tests with race detector
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          packages="$(go list ./... | grep -v -e '/internal/identity/postgres$' -e '/internal/household/postgres$' -e '/internal/subject/postgres$' -e '/internal/item/postgres$')"
          [[ -n "$packages" ]]
          go test -race $packages
      - name: Go build
        working-directory: backend
        run: go build ./...
      - name: Verify local gate failure propagation and CI workflow structure
        run: python3 -m unittest scripts/test_verify_local.py scripts/test_ci_workflow.py

  api:
    name: api
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Validate, audit, and check generated API artifacts
        shell: bash
        working-directory: api
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=moderate
          npm run check

  frontend:
    name: frontend
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install, audit, and check
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=moderate
          npm run check

  postgres:
    name: postgres
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TENDO_TEST_POSTGRES_ADMIN_URL: postgresql://postgres:ci-postgres-password@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Install native PostgreSQL 18 client and sqlc 1.30.0
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          psql_version=$(psql --version)
          if [[ ! "$psql_version" =~ PostgreSQL\)\ 18([.]|$) ]]; then
            printf 'PostgreSQL client major 18 is required; found %s\n' "$psql_version" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/bin"
          archive="$RUNNER_TEMP/sqlc_1.30.0_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" https://github.com/sqlc-dev/sqlc/releases/download/v1.30.0/sqlc_1.30.0_linux_amd64.tar.gz
          printf '%s  %s\n' '468aecee071bfe55e97fcbcac52ea0208eeca444f67736f3b8f0f3d6a106132e' "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" sqlc
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/sqlc" version | grep -Fx 'v1.30.0'
      - name: Bootstrap PostgreSQL 18 integration service
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for _ in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -U postgres -d postgres; then ready=1; break; fi
            sleep 1
          done
          if (( ready == 0 )); then echo 'PostgreSQL 18 service did not become ready' >&2; exit 1; fi
          PGPASSWORD=ci-postgres-password psql "$TENDO_TEST_POSTGRES_ADMIN_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname='tendo') THEN
              RAISE EXCEPTION 'unexpected pre-existing tendo role on new CI service';
            END IF;
            CREATE ROLE tendo NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          END $$;
          SQL
      - name: PostgreSQL integration tests
        run: bash scripts/setup-integration.sh
      - name: sqlc generated output is current
        run: bash scripts/check-sqlc.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            frontend/package-lock.json
      - name: Install API Node dependencies for generator harness
        working-directory: api
        run: npm ci
      - name: Install frontend Node dependencies for process harness
        working-directory: frontend
        run: npm ci
      - name: Install pinned Playwright Chromium prerequisites
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: PostgreSQL and native harness control tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest scripts/test_postgres_test_service.py scripts/test_e2e_native_runner.py scripts/test_verify_local.py
          python3 scripts/test_postgres_live.py
          python3 -m unittest scripts/test_generation_drift.py
          python3 scripts/test_e2e_interrupt.py

  e2e:
    name: e2e
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TENDO_TEST_POSTGRES_ADMIN_URL: postgresql://postgres:ci-postgres-password@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Install native PostgreSQL 18 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          psql_version=$(psql --version)
          if [[ ! "$psql_version" =~ PostgreSQL\)\ 18([.]|$) ]]; then
            printf 'PostgreSQL client major 18 is required; found %s\n' "$psql_version" >&2
            exit 1
          fi
      - name: Bootstrap PostgreSQL 18 E2E service
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for _ in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -U postgres -d postgres; then ready=1; break; fi
            sleep 1
          done
          if (( ready == 0 )); then echo 'PostgreSQL 18 service did not become ready' >&2; exit 1; fi
          PGPASSWORD=ci-postgres-password psql "$TENDO_TEST_POSTGRES_ADMIN_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname='tendo') THEN
              RAISE EXCEPTION 'unexpected pre-existing tendo role on new CI service';
            END IF;
            CREATE ROLE tendo NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          END $$;
          SQL
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install pinned Playwright Chromium prerequisites
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser E2E against native production build and PostgreSQL
        timeout-minutes: 15
        run: bash scripts/e2e-smoke.sh

  deployment:
    name: deployment (${{ matrix.smoke }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        smoke: [runtime-smoke, setup-smoke, oidc-smoke, proxy-smoke, backup-restore-smoke, household-backup-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: true
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API Node dependencies for response contract checks
        working-directory: api
        run: npm ci
      - name: Run unchanged Docker deployment smoke
        timeout-minutes: 20
        shell: bash
        env:
          SMOKE: ${{ matrix.smoke }}
        run: |
          set -euo pipefail
          case "$SMOKE" in
            proxy-smoke) timeout_seconds=720 ;;
            household-backup-smoke) timeout_seconds=900 ;;
            *) timeout_seconds=1200 ;;
          esac
          timeout "$timeout_seconds" bash "scripts/${SMOKE}.sh"

  required:
    name: required
    if: always()
    timeout-minutes: 2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [backend, api, frontend, postgres, e2e, deployment]
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Require every job to succeed
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          jq -e 'length == 6 and all(.[]; .result == "success")' <<<"$NEEDS_JSON" >/dev/null
