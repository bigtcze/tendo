name: Required

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  required:
    name: required
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false

      - name: Validate autonomous bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f .autonomous/GUARDRAILS.md
          test -f .autonomous/CHARTER.md
          test -f .autonomous/PRODUCT.md
          test -f .autonomous/ROADMAP.md
          test -f .autonomous/UX.md
          test -f .autonomous/ARCHITECTURE.md
          test -f .autonomous/API.md
          test -f .autonomous/TESTING.md
          test -f .autonomous/DOCUMENTATION.md
          test -f .autonomous/DEFINITION_OF_DONE.md
          test -f .autonomous/FLOW.md
          test -f .autonomous/STATE.md
          test -f .autonomous/LEARNINGS.md
          test -f .autonomous/CYCLE_PROMPT.md
          bash -n scripts/autonomous-loop.sh

      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(gofmt -l $(find backend -name '*.go' -type f))"
          if [[ -n "$files" ]]; then
            printf 'Go files need formatting:\n%s\n' "$files"
            exit 1
          fi

      - name: Go vet
        working-directory: backend
        run: go vet ./...

      - name: Go tests with race detector
        working-directory: backend
        run: go test -race ./...

      - name: Go build
        working-directory: backend
        run: go build ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Validate, audit, and check generated API artifacts
        working-directory: api
        run: npm ci && npm audit --audit-level=moderate && npm run check

      - name: Production Docker and PostgreSQL runtime smoke
        run: bash scripts/runtime-smoke.sh

      - name: Reverse proxy boundary smoke
        timeout-minutes: 12
        run: bash scripts/proxy-smoke.sh

      - name: PostgreSQL backup and restore smoke
        run: bash scripts/backup-restore-smoke.sh

      # Keep this job/check name stable.
      # As implementation grows, this `required` job MUST become the aggregate
      # gate for contract/static/unit/integration/frontend/e2e/build/migration checks.
