name: Required

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: required-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: backend
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/toolchain
      - name: Go lint (gofmt, go vet, staticcheck, structure)
        working-directory: backend
        run: golangci-lint run ./...
      - name: Go unit tests with race detector
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          packages="$(go list ./... | grep -v -e '/internal/identity/postgres$' -e '/internal/household/postgres$' -e '/internal/subject/postgres$' -e '/internal/item/postgres$')"
          [[ -n "$packages" ]]
          go test -race $packages
      - name: Go build
        working-directory: backend
        run: go build ./...

  api:
    name: api
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/toolchain
      - name: Validate, audit, and check generated API artifacts
        shell: bash
        working-directory: api
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=moderate
          npm run check

  frontend:
    name: frontend
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/toolchain
      - name: Frontend install, audit, and check
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm audit --audit-level=moderate
          npm run check

  postgres:
    name: postgres
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TENDO_TEST_POSTGRES_ADMIN_URL: postgresql://postgres:ci-postgres-password@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/toolchain
      - name: Install native PostgreSQL 18 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          psql_version=$(psql --version)
          if [[ ! "$psql_version" =~ PostgreSQL\)\ 18([.]|$) ]]; then
            printf 'PostgreSQL client major 18 is required; found %s\n' "$psql_version" >&2
            exit 1
          fi
      - name: Bootstrap PostgreSQL 18 integration service
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for _ in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -U postgres -d postgres; then ready=1; break; fi
            sleep 1
          done
          if (( ready == 0 )); then echo 'PostgreSQL 18 service did not become ready' >&2; exit 1; fi
          PGPASSWORD=ci-postgres-password psql "$TENDO_TEST_POSTGRES_ADMIN_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname='tendo') THEN
              RAISE EXCEPTION 'unexpected pre-existing tendo role on new CI service';
            END IF;
            CREATE ROLE tendo NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          END $$;
          SQL
      - name: PostgreSQL integration tests
        run: bash scripts/setup-integration.sh
      - name: sqlc generated output is current
        run: bash scripts/check-sqlc.sh

  e2e:
    name: e2e
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TENDO_TEST_POSTGRES_ADMIN_URL: postgresql://postgres:ci-postgres-password@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/toolchain
      - name: Install native PostgreSQL 18 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg
          . /etc/os-release
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          psql_version=$(psql --version)
          if [[ ! "$psql_version" =~ PostgreSQL\)\ 18([.]|$) ]]; then
            printf 'PostgreSQL client major 18 is required; found %s\n' "$psql_version" >&2
            exit 1
          fi
      - name: Bootstrap PostgreSQL 18 E2E service
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for _ in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -U postgres -d postgres; then ready=1; break; fi
            sleep 1
          done
          if (( ready == 0 )); then echo 'PostgreSQL 18 service did not become ready' >&2; exit 1; fi
          PGPASSWORD=ci-postgres-password psql "$TENDO_TEST_POSTGRES_ADMIN_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname='tendo') THEN
              RAISE EXCEPTION 'unexpected pre-existing tendo role on new CI service';
            END IF;
            CREATE ROLE tendo NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          END $$;
          SQL
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install pinned Playwright Chromium prerequisites
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser E2E against native production build and PostgreSQL
        id: e2e
        timeout-minutes: 15
        env:
          E2E_CI_UPLOAD_DIR: ${{ runner.temp }}/e2e-ci-upload-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_DIAGNOSTICS_RECIPIENT: ci/e2e-artifact-recipient.asc
        run: bash scripts/e2e-smoke.sh
      - name: Upload E2E failure diagnostics
        if: ${{ (failure() || cancelled()) && steps.e2e.outputs.ci_upload == 'ready' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-ci-upload-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: false

  deployment:
    name: deployment (${{ matrix.smoke }}${{ matrix.from && format(' {0}', matrix.from) || '' }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - smoke: setup-smoke
          - smoke: oidc-smoke
          - smoke: proxy-smoke
            timeout: 720
          - smoke: household-backup-smoke
            timeout: 900
          - smoke: upgrade-smoke
            from: v1.0.0
            timeout: 900
          - smoke: upgrade-smoke
            from: v2.1.0
            timeout: 900
          - smoke: quickstart-smoke
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/toolchain
      - name: Install API Node dependencies for response contract checks
        working-directory: api
        run: npm ci
      - name: Run Docker deployment smoke
        timeout-minutes: 20
        env:
          TENDO_UPGRADE_FROM: ${{ matrix.from }}
        run: timeout ${{ matrix.timeout || 1200 }} bash scripts/${{ matrix.smoke }}.sh

  required:
    name: required
    if: always()
    timeout-minutes: 2
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [backend, api, frontend, postgres, e2e, deployment]
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Require every job to succeed
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          jq -e 'length == 6 and all(.[]; .result == "success")' <<<"$NEEDS_JSON" >/dev/null
